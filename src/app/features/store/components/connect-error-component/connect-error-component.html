<div class="flex min-h-[60vh] items-center justify-center p-4 sm:p-8">
  <div
    class="aa-rise w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xl sm:p-10 dark:border-slate-800 dark:bg-slate-900"
  >
    <div
      class="aa-pop mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-rose-50 dark:bg-rose-500/10"
    >
      <svg lucideTriangleAlert class="h-7 w-7 text-rose-500"></svg>
    </div>

    <h1 class="mt-6 text-2xl font-semibold text-slate-900 dark:text-slate-100">
      Unable to connect your store
    </h1>
    <p class="mt-2 text-slate-500 dark:text-slate-400">
      We couldn't complete the connection with your store.
    </p>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <button
        type="button"
        (click)="retry()"
        class="flex h-12 w-full items-center justify-center rounded-xl bg-accent-500 text-base font-semibold text-white outline-hidden transition hover:text-white hover:bg-accent-600 focus-visible:ring-2 focus-visible:ring-accent-300 focus-visible:ring-offset-2 dark:focus-visible:ring-offset-slate-900"
      >
        Try Again
      </button>
      <button
        type="button"
        (click)="backToDashboard()"
        class="flex h-12 w-full items-center justify-center rounded-xl border border-slate-300 bg-white text-base font-semibold text-slate-700 transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
      >
        Back to Dashboard
      </button>
    </div>
  </div>
</div>
