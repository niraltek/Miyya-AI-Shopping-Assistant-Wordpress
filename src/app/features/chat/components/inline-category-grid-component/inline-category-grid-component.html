<ul class="grid grid-cols-2 gap-2" aria-label="Shop by category">
  @for (tile of visible(); track tile.id) {
    <li class="min-w-0">
      <button
        type="button"
        (click)="select.emit(tile)"
        [disabled]="disabled()"
        [attr.aria-label]="'Browse ' + tile.name + ', ' + summary(tile)"
        class="aa-category-tile group flex h-full w-full flex-col overflow-hidden rounded-2xl bg-white text-left shadow-sm ring-1 ring-slate-200/80 transition duration-200 hover:-translate-y-0.5 hover:shadow-md hover:ring-accent-300 focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:outline-none disabled:cursor-not-allowed disabled:opacity-60 dark:bg-slate-900 dark:ring-slate-800 dark:hover:ring-accent-500/60"
      >
        <span
          class="flex aspect-[4/3] w-full items-center justify-center overflow-hidden border-b border-slate-100 bg-white dark:border-slate-800"
        >
          @if (tile.imageUrl && !failedImages().has(tile.id)) {
            <img
              [src]="tile.imageUrl"
              alt=""
              loading="lazy"
              (error)="onImageError(tile.id)"
              class="h-full w-full object-contain p-2 transition-transform duration-200 group-hover:scale-105"
            />
          } @else {
            <svg lucideImage class="h-8 w-8 text-slate-300" aria-hidden="true"></svg>
          }
        </span>
        <span class="flex flex-1 items-start gap-1 px-2.5 pt-2 pb-2.5">
          <span class="min-w-0 flex-1">
            <span
              class="line-clamp-2 block text-[13px] font-semibold leading-snug text-slate-900 dark:text-slate-100"
              >{{ tile.name }}</span
            >
            <span
              class="mt-0.5 block truncate text-[11.5px] tabular-nums text-slate-500 dark:text-slate-400"
              >{{ summary(tile) }}</span
            >
            @if (tile.subcategories.length) {
              <span class="mt-0.5 block truncate text-[11px] text-slate-400 dark:text-slate-500">{{
                tile.subcategories.join(', ')
              }}</span>
            }
          </span>
          <svg
            lucideChevronRight
            class="mt-0.5 h-4 w-4 shrink-0 text-slate-300 transition group-hover:translate-x-0.5 group-hover:text-accent-700 dark:group-hover:text-accent-300"
            aria-hidden="true"
          ></svg>
        </span>
      </button>
    </li>
  }
</ul>

@if (hiddenCount() > 0) {
  <button
    type="button"
    (click)="expanded.set(!expanded())"
    [attr.aria-expanded]="expanded()"
    class="mt-2 flex w-full items-center justify-center gap-1.5 rounded-xl bg-white px-3 py-2.5 text-xs font-semibold text-accent-700 ring-1 ring-slate-200 transition hover:-translate-y-px hover:ring-accent-400 dark:bg-slate-900 dark:text-accent-300 dark:ring-slate-700 dark:hover:ring-accent-500/60"
  >
    {{ expanded() ? 'Show fewer categories' : 'Show all ' + categories().length + ' categories' }}
    <svg
      lucideChevronDown
      class="h-3.5 w-3.5 transition-transform"
      [class.rotate-180]="expanded()"
      aria-hidden="true"
    ></svg>
  </button>
}
