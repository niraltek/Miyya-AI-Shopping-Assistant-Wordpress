@if (notice(); as value) {
  <div
    role="status"
    class="border-b"
    [class]="
      value.tone === 'error'
        ? 'border-rose-200 bg-rose-50 dark:border-rose-900/60 dark:bg-rose-950/40'
        : value.tone === 'warning'
          ? 'border-amber-200 bg-amber-50 dark:border-amber-900/60 dark:bg-amber-950/40'
          : 'border-sky-200 bg-sky-50 dark:border-sky-900/60 dark:bg-sky-950/40'
    "
  >
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 sm:px-6">
      <svg
        [lucideIcon]="value.tone === 'info' ? infoIcon : alertIcon"
        aria-hidden="true"
        class="h-5 w-5 shrink-0"
        [class]="
          value.tone === 'error'
            ? 'text-rose-600 dark:text-rose-400'
            : value.tone === 'warning'
              ? 'text-amber-600 dark:text-amber-400'
              : 'text-sky-600 dark:text-sky-400'
        "
      ></svg>

      <div class="min-w-0 flex-1">
        <p
          class="text-sm font-semibold"
          [class]="
            value.tone === 'error'
              ? 'text-rose-900 dark:text-rose-100'
              : value.tone === 'warning'
                ? 'text-amber-900 dark:text-amber-100'
                : 'text-sky-900 dark:text-sky-100'
          "
        >
          {{ value.title }}
        </p>
        <p
          class="text-xs"
          [class]="
            value.tone === 'error'
              ? 'text-rose-700 dark:text-rose-300'
              : value.tone === 'warning'
                ? 'text-amber-700 dark:text-amber-300'
                : 'text-sky-700 dark:text-sky-300'
          "
        >
          {{ value.detail }}
        </p>
      </div>

      <a
        [href]="manageUrl()"
        target="_blank"
        rel="noopener noreferrer"
        (click)="openBilling($event)"
        class="shrink-0 rounded-lg px-3 py-1.5 text-xs font-semibold text-white transition"
        [class]="
          value.tone === 'error'
            ? 'bg-rose-600 hover:bg-rose-700'
            : value.tone === 'warning'
              ? 'bg-amber-600 hover:bg-amber-700'
              : 'bg-sky-600 hover:bg-sky-700'
        "
      >
        {{ isOpeningBillingPortal() ? 'Sending one-time password…' : value.actionLabel }}
      </a>
      @if (billingPortalError(); as message) {
        <p role="alert" class="basis-full text-xs text-rose-700 dark:text-rose-300">
          {{ message }}
        </p>
      }
    </div>
  </div>
}
