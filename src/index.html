<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Miyya</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#072D73">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body { margin: 0; }
    .aa-startup {
      display: flex;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: #f8fafc;
      color: #334155;
      font: 500 14px/1.5 ui-sans-serif, system-ui, sans-serif;
    }
    .aa-startup-indicator {
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      border: 3px solid #dbeafe;
      border-top-color: #072d73;
      border-radius: 50%;
      animation: aa-startup-spin 0.8s linear infinite;
    }
    .dark .aa-startup { background: #020617; color: #e2e8f0; }
    @keyframes aa-startup-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .aa-startup-indicator { animation: none; }
    }
  </style>
</head>

<body>
  <app-root>
    <div class="aa-startup" role="status">
      <span class="aa-startup-indicator" aria-hidden="true"></span>
      <span>Loading Miyya…</span>
    </div>
  </app-root>
</body>

</html>
